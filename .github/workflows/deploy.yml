name: Deploy to EC2

on:
  push:
    branches:
      - main
      - feat/course
  workflow_dispatch:

env:
  DOCKER_IMAGE: coursue-frontend
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "image.tar.gz,docker-compose.yml,.env.production"
          target: "/home/${{ secrets.EC2_USER }}/coursue-frontend"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/coursue-frontend

            # Load Docker image
            docker load < image.tar.gz
            rm image.tar.gz

            # Stop old containers
            docker-compose down

            # Start new containers
            docker-compose up -d

            # Clean up old images
            docker image prune -f

            # Show running containers
            docker-compose ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Wait for container to be ready
            sleep 10

            # Check if container is running
            if docker-compose -f /home/${{ secrets.EC2_USER }}/coursue-frontend/docker-compose.yml ps | grep -q "Up"; then
              echo "✅ Deployment successful!"
              docker-compose -f /home/${{ secrets.EC2_USER }}/coursue-frontend/docker-compose.yml logs --tail=50
            else
              echo "❌ Deployment failed!"
              docker-compose -f /home/${{ secrets.EC2_USER }}/coursue-frontend/docker-compose.yml logs --tail=50
              exit 1
            fi
